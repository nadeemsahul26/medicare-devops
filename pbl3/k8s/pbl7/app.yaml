# PBL 7 - CI/CD to Kubernetes: one Deployment updated with a zero-downtime rolling update.
# ${IMAGE} and ${TAG} are filled in by Jenkins with envsubst.
apiVersion: v1
kind: Namespace
metadata:
  name: pbl7
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare
  namespace: pbl7
  labels: { app: medicare }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # start 1 new pod at a time
      maxUnavailable: 0    # never drop below 3 ready pods -> zero downtime
  selector:
    matchLabels: { app: medicare }
  template:
    metadata:
      labels: { app: medicare }
    spec:
      containers:
        - name: medicare
          image: ${IMAGE}:${TAG}
          ports:
            - containerPort: 5000
          env:
            - { name: APP_VERSION, value: "v${TAG}" }
            - { name: APP_COLOR, value: "blue" }
            - { name: PBL_MODE, value: "pbl7 ci/cd" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: medicare
  namespace: pbl7
spec:
  type: NodePort
  selector: { app: medicare }
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30007
