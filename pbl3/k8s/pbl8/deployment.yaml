# PBL 8 - Blue-Green: the SAME template is applied twice, once as medicare-blue and once as
# medicare-green. Jenkins fills ${COLOR}, ${IMAGE}, ${TAG} with envsubst.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-${COLOR}
  namespace: pbl8
  labels: { app: medicare, version: "${COLOR}" }
spec:
  replicas: 2
  selector:
    matchLabels: { app: medicare, version: "${COLOR}" }
  template:
    metadata:
      labels: { app: medicare, version: "${COLOR}" }
    spec:
      containers:
        - name: medicare
          image: ${IMAGE}:${TAG}
          ports:
            - containerPort: 5000
          env:
            - { name: APP_VERSION, value: "v${TAG}" }
            - { name: APP_COLOR, value: "${COLOR}" }
            - { name: PBL_MODE, value: "pbl8 blue-green" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
